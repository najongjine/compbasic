<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>NAI自動複数生成</title>
    <style>
      body {
        width: 300px;
        padding: 10px;
      }
      input,
      button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>NAI設定</h1>
    <p>ページが完全にロードされてからご利用ください</p>
    <p>回数に上限はありませんが、10枚以上の大量生成に関しては未検証です</p>
    <p>※あくまで自己責任でご利用ください</p>
    <div>
      <label for="randomToggle">特別クリック機能:</label>
      <input type="checkbox" id="randomToggle" />
    </div>
    <div>
      <label for="prefix">接頭語:</label><br />
      <textarea id="prefix" rows="2" cols="40" disabled></textarea>
    </div>
    <div>
      <label for="clicksCount">クリック回数:</label>
      <input type="number" id="clicksCount" min="1" max="10" value="1" />
      <button id="startClicking">開始</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
